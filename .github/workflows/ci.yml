name: CI

# Two checks back the branch protection rulesets (validate, version-bump):
# PRs cannot merge without them. This is a datapack repository - there is no
# Java to build and no GameTest to run, so the mod template's junit/gametest
# jobs are replaced by the datapack validator.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate the datapack
        run: python tools/validate.py

  version-bump:
    name: version-bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce version bump rules
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          NEW_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          OLD_VERSION=$(git show "$BASE:gradle.properties" | grep '^mod_version=' | cut -d= -f2 | tr -d '[:space:]')

          echo "base mod_version: $OLD_VERSION"
          echo "head mod_version: $NEW_VERSION"

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "--- changed files ---"
          echo "$CHANGED"

          if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
            echo "No version bump. This PR builds as an alpha (nightly). OK."
            exit 0
          fi

          case "$NEW_VERSION" in
            *-alpha*|*-Alpha*|*-ALPHA*) CHANNEL="alpha" ;;
            *-*) CHANNEL="beta" ;;
            *) CHANNEL="stable" ;;
          esac

          echo "detected channel: $CHANNEL"

          if [ "$CHANNEL" = "alpha" ]; then
            echo "Alpha version bump. Bundling other changes is permitted. OK."
            exit 0
          fi

          EXTRA=$(echo "$CHANGED" | grep -v '^gradle\.properties$' | grep -v '^$' || true)
          if [ -n "$EXTRA" ]; then
            echo "::error::A $CHANNEL version bump must change gradle.properties and nothing else."
            echo "::error::These files must not accompany a $CHANNEL bump:"
            echo "$EXTRA"
            echo "::error::Either split the version bump into its own PR, or use an -alpha suffix to bundle it with the work."
            exit 1
          fi

          echo "Isolated $CHANNEL version bump. OK."
